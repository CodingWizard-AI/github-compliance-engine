# @golden-thread FEAT-SCAFFOLD-001, BR-CORE-001, TC-CORE-001, V-CORE-001
name: github-compliance-engine

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-http://localhost:8000}
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
        FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-http://localhost:8000}
      PORT: ${FRONTEND_PORT:-3000}
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      args:
        BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
        BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      INGESTION_WORKSPACE_ROOT: ${INGESTION_WORKSPACE_ROOT:-/tmp/github-compliance-engine/analyses}
      INGESTION_CLONE_DEPTH: ${INGESTION_CLONE_DEPTH:-1}
      INGESTION_CLONE_TIMEOUT_SECONDS: ${INGESTION_CLONE_TIMEOUT_SECONDS:-60}
    depends_on:
      neo4j-init:
        condition: service_completed_successfully

  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    volumes:
      - neo4j-data:/data
      - ./graph-db/conf/neo4j.conf:/conf/neo4j.conf:ro

  neo4j-init:
    image: neo4j:5-community
    depends_on:
      - neo4j
    environment:
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    volumes:
      - ./graph-db/init:/init:ro
    command:
      - /bin/bash
      - -lc
      - |
        until /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u "$${NEO4J_USER}" -p "$${NEO4J_PASSWORD}" "RETURN 1"; do
          sleep 2
        done
        /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u "$${NEO4J_USER}" -p "$${NEO4J_PASSWORD}" -f /init/constraints.cypher
        /var/lib/neo4j/bin/cypher-shell -a bolt://neo4j:7687 -u "$${NEO4J_USER}" -p "$${NEO4J_PASSWORD}" -f /init/indexes.cypher
    restart: "no"

volumes:
  neo4j-data:
